[project]
name = "invoice-agent"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.162.0",
    "pdfplumber==0.11.10",
    "pydantic-ai-slim[xai]==2.62.0",
    "python-dotenv==1.2.4",
    "python-multipart==0.0.32",
    "rich==15.0.0",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls the real Grok API (run with `pytest -m live`)"]
